<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=block" rel="stylesheet">
<style>html,body{margin:0;background:transparent}svg{display:block}</style></head><body>
<svg id="logo" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
<defs>
 <radialGradient id="sky" cx="50%" cy="35%" r="70%"><stop offset="0" stop-color="#2f4f9a"/><stop offset="1" stop-color="#16224f"/></radialGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#f2a93b"/></linearGradient>
 <radialGradient id="glow" cx="50%" cy="60%" r="50%"><stop offset="0" stop-color="#fff3c4" stop-opacity=".9"/><stop offset="1" stop-color="#fff3c4" stop-opacity="0"/></radialGradient>
 <path id="star" d="M0,-1 L.28,-.28 L1,0 L.28,.28 L0,1 L-.28,.28 L-1,0 L-.28,-.28Z"/>
</defs>
<g class="badge">
 <circle cx="512" cy="512" r="496" fill="url(#gold)"/>
 <circle cx="512" cy="512" r="470" fill="url(#sky)"/>
</g>
<!-- stars -->
<g fill="#ffe7a3">
 <use href="#star" transform="translate(250 250) scale(22)"/>
 <use href="#star" transform="translate(780 230) scale(16)"/>
 <use href="#star" transform="translate(820 400) scale(11)"/>
 <use href="#star" transform="translate(210 420) scale(12)"/>
 <use href="#star" transform="translate(330 170) scale(9)"/>
</g>
<!-- glow above book -->
<ellipse cx="512" cy="430" rx="250" ry="200" fill="url(#glow)"/>
<!-- crescent rising from book -->
<path d="M560 170 a150 150 0 1 0 110 250 a120 120 0 1 1 -110 -250z" fill="url(#gold)"/>
<!-- open book -->
<g stroke="#16224f" stroke-width="10" stroke-linejoin="round">
 <path d="M512 470 C440 430 340 425 270 445 L270 610 C340 590 440 595 512 635Z" fill="#fff8e7"/>
 <path d="M512 470 C584 430 684 425 754 445 L754 610 C684 590 584 595 512 635Z" fill="#fff8e7"/>
</g>
<g stroke="#e9c77a" stroke-width="8" stroke-linecap="round" fill="none">
 <path d="M310 490 C370 478 430 482 480 500"/><path d="M310 530 C370 518 430 522 480 540"/><path d="M310 570 C370 558 430 562 480 580"/>
 <path d="M714 490 C654 478 594 482 544 500"/><path d="M714 530 C654 518 594 522 544 540"/><path d="M714 570 C654 558 594 562 544 580"/>
</g>
<!-- wordmark -->
<text x="512" y="790" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="200" fill="url(#gold)" stroke="#16224f" stroke-width="0" letter-spacing="4">arasy</text>
<text x="512" y="870" text-anchor="middle" font-family="Fredoka" font-weight="600" font-size="46" fill="#cfe0ff" letter-spacing="6">CERITA ISLAMIK</text>
</svg>
<svg id="mark" width="1024" height="1024" viewBox="0 0 1024 1024"></svg>
</body></html>
