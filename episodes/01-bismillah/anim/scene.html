<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&display=block" rel="stylesheet">
<style>html,body{margin:0;background:#000;overflow:hidden}svg{display:block}</style></head>
<body><svg id="s" width="540" height="960" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
// ---------- helpers ----------
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease=x=>{x=clamp(x);return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2};
const back=x=>{x=clamp(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,k)=>a+(b-a)*k;
const seg=(t,a,b)=>ease((t-a)/(b-a));               // eased progress of t within [a,b]
const D2R=Math.PI/180;
function blink(t,ph){const c=(t+ph)%3.3;return c<0.12?0.08:1}
const SKIN='#f3c9a4',NAVY='#2a2140',LIP='#a8423f';

// ---------- background ----------
function room(t){
  let g='';
  g+=`<defs>
   <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbeed6"/><stop offset="1" stop-color="#f0d9b5"/></linearGradient>
   <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd0f5"/><stop offset="1" stop-color="#d6f0ff"/></linearGradient>
   <radialGradient id="lampglow"><stop offset="0" stop-color="#fff2c0" stop-opacity=".85"/><stop offset="1" stop-color="#fff2c0" stop-opacity="0"/></radialGradient>
   <radialGradient id="bulbglow"><stop offset="0" stop-color="#fff6b0" stop-opacity="1"/><stop offset="1" stop-color="#ffe27a" stop-opacity="0"/></radialGradient>
   <radialGradient id="plateglow"><stop offset="0" stop-color="#ffe9a0" stop-opacity=".9"/><stop offset="1" stop-color="#ffe9a0" stop-opacity="0"/></radialGradient>
   <path id="star" d="M0,-1 L.25,-.25 L1,0 L.25,.25 L0,1 L-.25,.25 L-1,0 L-.25,-.25Z"/>
  </defs>`;
  g+=`<rect x="-400" y="-400" width="1880" height="2800" fill="url(#wall)"/>`;
  g+=`<rect x="-400" y="1120" width="1880" height="200" fill="#e7c99c"/><rect x="-400" y="1112" width="1880" height="14" fill="#d1ab78"/>`;
  // window
  g+=`<rect x="40" y="250" width="330" height="460" rx="14" fill="#fff" />
      <rect x="58" y="268" width="294" height="424" rx="8" fill="url(#sky)"/>
      <ellipse cx="150" cy="380" rx="55" ry="22" fill="#fff" opacity=".9"/><ellipse cx="190" cy="370" rx="40" ry="26" fill="#fff" opacity=".9"/>
      <path d="M58 620 Q120 560 200 610 T352 590 L352 692 L58 692Z" fill="#7cc576"/>
      <rect x="198" y="268" width="14" height="424" fill="#fff"/><rect x="58" y="472" width="294" height="12" fill="#fff"/>
      <path d="M20 230 Q60 480 30 740 L-20 740 L-20 230Z" fill="#7fb7a4"/><path d="M390 230 Q350 480 380 740 L430 740 L430 230Z" fill="#7fb7a4"/>
      <rect x="0" y="222" width="430" height="18" rx="9" fill="#8a5a3b"/>`;
  // calligraphy frame
  g+=`<rect x="610" y="330" width="380" height="230" rx="10" fill="#b98a4a"/>
      <rect x="626" y="346" width="348" height="198" rx="6" fill="#2f6b55"/>
      <text x="800" y="475" text-anchor="middle" font-family="Amiri" font-weight="700" font-size="92" fill="#f4cf75">بسم الله</text>`;
  // lamp
  const sw=Math.sin(t*1.6)*3;
  g+=`<g transform="rotate(${sw} 540 -100)"><line x1="540" y1="-100" x2="540" y2="230" stroke="#6b4a33" stroke-width="5"/>
      <ellipse cx="540" cy="330" rx="200" ry="120" fill="url(#lampglow)"/>
      <path d="M470 300 Q540 210 610 300Z" fill="#e59a4b"/><ellipse cx="540" cy="302" rx="22" ry="10" fill="#fff6cf"/></g>`;
  return g;
}

function table(){
  return `<rect x="-400" y="1280" width="1880" height="900" fill="#a86b3c"/>
   <rect x="-400" y="1270" width="1880" height="240" fill="#f5efe3"/>
   <path d="M-400 1510 ${Array.from({length:30},(_,i)=>`Q${-370+i*60} 1545 ${-340+i*60} 1510`).join(' ')} L1480 1510Z" fill="#f5efe3"/>
   ${Array.from({length:30},(_,i)=>`<circle cx="${-380+i*60}" cy="1488" r="7" fill="#e3a7a0"/>`).join('')}`;
}

function plate(x,y,big,glow=0,eaten=0){
  let g='';
  if(glow>0) g+=`<ellipse cx="${x}" cy="${y-30}" rx="230" ry="170" fill="url(#plateglow)" opacity="${glow}"/>`;
  const r=big?150:105;
  g+=`<ellipse cx="${x}" cy="${y+8}" rx="${r+6}" ry="${r*.38+6}" fill="#d8d2c4"/>
      <ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r*.38}" fill="#fff"/>
      <ellipse cx="${x}" cy="${y}" rx="${r*.78}" ry="${r*.28}" fill="#f2efe8"/>`;
  if(big){ // nasi lemak
    g+=`<ellipse cx="${x-10}" cy="${y-4}" rx="110" ry="34" fill="#5fa34f"/>
        <path d="M${x-75} ${y} Q${x-60} ${y-80} ${x-5} ${y-82} Q${x+45} ${y-80} ${x+55} ${y} Z" fill="#fffdf6"/>
        <ellipse cx="${x+70}" cy="${y-6}" rx="36" ry="20" fill="#fff"/><circle cx="${x+72}" cy="${y-9}" r="13" fill="#f6b52c"/>
        <ellipse cx="${x-90}" cy="${y+8}" rx="20" ry="9" fill="#9ad16e" stroke="#4f8f3a" stroke-width="3"/>
        <ellipse cx="${x-55}" cy="${y+14}" rx="20" ry="9" fill="#9ad16e" stroke="#4f8f3a" stroke-width="3"/>
        <path d="M${x+5} ${y+14} q20 -22 46 -6 q14 14 -12 20 q-24 6 -34 -14z" fill="#d6402e"/>`;
    if(eaten<1) g+=`<g transform="translate(${x+20} ${y-38}) rotate(-25)"><ellipse cx="0" cy="0" rx="48" ry="28" fill="#b8612b"/><ellipse cx="-6" cy="-6" rx="36" ry="16" fill="#cf7a3a"/><rect x="40" y="-7" width="34" height="14" rx="7" fill="#fff6e6"/><circle cx="76" cy="-8" r="9" fill="#fff6e6"/><circle cx="76" cy="8" r="9" fill="#fff6e6"/></g>`;
  } else {
    g+=`<path d="M${x-55} ${y} Q${x-40} ${y-55} ${x} ${y-56} Q${x+40} ${y-55} ${x+50} ${y} Z" fill="#fffdf6"/>
        <ellipse cx="${x+55}" cy="${y-4}" rx="26" ry="14" fill="#fff"/><circle cx="${x+56}" cy="${y-6}" r="9" fill="#f6b52c"/>`;
  }
  return g;
}
function cup(x,y,c){return `<path d="M${x-28} ${y-80} L${x+28} ${y-80} L${x+22} ${y} L${x-22} ${y}Z" fill="${c}" opacity=".9"/><ellipse cx="${x}" cy="${y-80}" rx="28" ry="8" fill="#fff" opacity=".6"/>`}

// ---------- characters ----------
// p: {x,y,s, outfit, cover:'kufi'|'hijab', hijab, beard, glasses, blink, mouth:'smile'|'big'|'o'|'open', open, look:[dx,dy], brow, happyEyes, bob, tilt}
function personBack(p){
  const o=p.outfit; let g=`<g transform="translate(${p.x} ${p.y+(p.bob||0)}) scale(${p.s}) rotate(${p.tilt||0} 0 -100)">`;
  g+=`<path d="M-125 60 Q-125 0 -70 -8 L70 -8 Q125 0 125 60 L140 460 L-140 460Z" fill="${o}"/>`;
  if(p.cover==='kufi'){ // baju melayu collar + buttons
    g+=`<path d="M-30 -8 L0 50 L30 -8" fill="none" stroke="rgba(0,0,0,.18)" stroke-width="6"/><circle cx="0" cy="75" r="6" fill="#f4cf75"/><circle cx="0" cy="105" r="6" fill="#f4cf75"/>`;
  }
  g+=`<rect x="-28" y="-50" width="56" height="50" fill="${SKIN}"/>`;
  if(p.cover==='hijab'){
    g+=`<path d="M0 -248 C115 -248 138 -150 132 -70 C150 -20 165 30 160 85 L-160 85 C-165 30 -150 -20 -132 -70 C-138 -150 -115 -248 0 -248Z" fill="${p.hijab}"/>`;
    g+=`<ellipse cx="0" cy="-118" rx="80" ry="90" fill="${SKIN}"/>`;
    g+=`<path d="M-80 -150 Q0 -230 80 -150 Q60 -200 0 -205 Q-60 -200 -80 -150Z" fill="${p.hijab}" opacity=".9"/>`;
  } else {
    g+=`<circle cx="-88" cy="-112" r="20" fill="#e8b48e"/><circle cx="88" cy="-112" r="20" fill="#e8b48e"/>`;
    g+=`<ellipse cx="0" cy="-118" rx="88" ry="96" fill="${SKIN}"/>`;
    g+=`<path d="M-86 -150 Q-90 -185 -70 -195 L70 -195 Q90 -185 86 -150 Q80 -170 60 -172 L-60 -172 Q-80 -170 -86 -150Z" fill="#3a2a22"/>`;
    g+=`<path d="M-92 -168 Q0 -268 92 -168 Z" fill="#fbfbf7"/><path d="M-92 -168 L92 -168" stroke="#d9d4c5" stroke-width="10"/>
        <path d="M-60 -200 Q0 -232 60 -200" stroke="#e3ddcc" stroke-width="4" fill="none"/>`;
  }
  if(p.beard) g+=`<path d="M-86 -125 Q-92 -20 0 -8 Q92 -20 86 -125 Q78 -66 0 -60 Q-78 -66 -86 -125Z" fill="#3b2a20"/>
                  <path d="M-34 -84 Q0 -100 34 -84 Q0 -90 -34 -84Z" fill="#3b2a20" stroke="#3b2a20" stroke-width="8" stroke-linejoin="round"/>`;
  // cheeks
  g+=`<circle cx="-54" cy="-88" r="18" fill="#f29b9b" opacity=".45"/><circle cx="54" cy="-88" r="18" fill="#f29b9b" opacity=".45"/>`;
  // eyes
  const [lx,ly]=p.look||[0,0];
  for(const ex of [-34,34]){
    if(p.happyEyes) g+=`<path d="M${ex-18} -118 Q${ex} -142 ${ex+18} -118" stroke="${NAVY}" stroke-width="7" fill="none" stroke-linecap="round"/>`;
    else{
      const b=p.blink??1, big=p.bigEyes?1.25:1;
      g+=`<g transform="translate(${ex} -122) scale(1 ${b})"><ellipse cx="0" cy="0" rx="${19*big}" ry="${24*big}" fill="#fff"/>
          <circle cx="${lx}" cy="${ly+2}" r="${14*big}" fill="${NAVY}"/><circle cx="${lx+5}" cy="${ly-4}" r="${4.5*big}" fill="#fff"/></g>`;
    }
  }
  const br=p.brow||0;
  g+=`<path d="M-54 ${-158-br} Q-34 ${-170-br} -14 ${-160-br}" stroke="#3b2a20" stroke-width="7" fill="none" stroke-linecap="round"/>
      <path d="M54 ${-158-br} Q34 ${-170-br} 14 ${-160-br}" stroke="#3b2a20" stroke-width="7" fill="none" stroke-linecap="round"/>`;
  if(p.glasses) g+=`<g fill="none" stroke="#333" stroke-width="5"><rect x="-64" y="-148" width="58" height="50" rx="16"/><rect x="6" y="-148" width="58" height="50" rx="16"/><path d="M-6 -126 Q0 -132 6 -126"/></g>`;
  g+=`<path d="M-6 -98 Q0 -88 6 -98" stroke="#d89b7a" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  // mouth
  const m=p.mouth||'smile', op=p.open??0;
  if(m==='smile') g+=`<path d="M-24 -74 Q0 -54 24 -74" stroke="${LIP}" stroke-width="7" fill="none" stroke-linecap="round"/>`;
  else if(m==='big') g+=`<path d="M-30 -78 Q0 -30 30 -78 Z" fill="${LIP}"/><path d="M-16 -50 Q0 -42 16 -50 Q0 -62 -16 -50Z" fill="#f08a8a"/>`;
  else if(m==='o') g+=`<ellipse cx="0" cy="-64" rx="14" ry="${12+op*6}" fill="${LIP}"/>`;
  else if(m==='open'){const h=4+op*22;g+=`<path d="M-22 -72 Q0 ${-72+h*1.6} 22 -72 Q0 ${-76+h*.2} -22 -72Z" fill="${LIP}"/>`}
  else if(m==='chew'){const w=18+op*6;g+=`<ellipse cx="0" cy="-66" rx="${w}" ry="${5+op*7}" fill="${LIP}"/>`}
  g+=`</g>`; return g;
}
// arm: side -1 = viewer-left shoulder, +1 = viewer-right. angle deg (0 = straight down, see notes), len local units.
function arm(p,side,ang,len,hand='fist',hold=false){
  const sx=p.x+side*95*p.s, sy=p.y+(p.bob||0)+20*p.s;
  const a=ang*D2R, L=len*p.s, hx=sx-Math.sin(a)*L, hy=sy+Math.cos(a)*L;
  let g=`<line x1="${sx}" y1="${sy}" x2="${hx}" y2="${hy}" stroke="rgba(60,40,50,.28)" stroke-width="${62*p.s}" stroke-linecap="round"/><line x1="${sx}" y1="${sy}" x2="${hx}" y2="${hy}" stroke="${p.outfit}" stroke-width="${54*p.s}" stroke-linecap="round"/>`;
  g+=`<line x1="${lerp(sx,hx,.86)}" y1="${lerp(sy,hy,.86)}" x2="${lerp(sx,hx,.93)}" y2="${lerp(sy,hy,.93)}" stroke="rgba(0,0,0,.12)" stroke-width="${54*p.s}"/>`;
  const r=30*p.s;
  if(hand==='finger') g+=`<rect x="${hx-8*p.s}" y="${hy-62*p.s}" width="${16*p.s}" height="${50*p.s}" rx="${8*p.s}" fill="${SKIN}"/>`;
  if(hand==='thumb')  g+=`<rect x="${hx-8*p.s}" y="${hy-58*p.s}" width="${17*p.s}" height="${44*p.s}" rx="${8*p.s}" fill="${SKIN}"/>`;
  if(hand==='open')   g+=`<ellipse cx="${hx}" cy="${hy}" rx="${r*1.25}" ry="${r*.85}" fill="${SKIN}"/>`;
  else g+=`<circle cx="${hx}" cy="${hy}" r="${r}" fill="${SKIN}" stroke="#d9a07c" stroke-width="${3*p.s}"/>`;
  if(hold) g+=`<circle cx="${hx+side*-4}" cy="${hy-24*p.s}" r="${18*p.s}" fill="#fffdf6"/><circle cx="${hx+10}" cy="${hy-32*p.s}" r="${9*p.s}" fill="#cf7a3a"/>`;
  return g;
}

// ---------- cast ----------
function cast(){return{
  mama:{x:175,y:1010,s:1,outfit:'#fdfaf2',cover:'hijab',hijab:'#8dbf9f',ph:.4},
  adam:{x:430,y:1060,s:.8,outfit:'#8fc8ee',cover:'kufi',ph:1.7},
  aisyah:{x:665,y:1055,s:.8,outfit:'#f7e6d0',cover:'hijab',hijab:'#f2a6c0',ph:2.6},
  abah:{x:900,y:1010,s:1,outfit:'#8b8f99',cover:'kufi',beard:1,glasses:1,ph:0},
}}
const REST=[-14,230],RESTR=[14,230];

function sparkles(t,cx,cy,start,n=26){
  let g='';
  for(let i=0;i<n;i++){
    const life=2.2, t0=start+(i/n)*2.4, k=(t-t0)/life; if(k<0||k>1) continue;
    const ang=(i*137.5)%360*D2R, rad=40+((i*53)%120);
    const x=cx+Math.cos(ang)*rad*.9+Math.sin(t*3+i)*12, y=cy-20-k*360+Math.sin(ang)*20;
    const sc=(10+(i%4)*7)*Math.sin(Math.PI*k);
    g+=`<use href="#star" transform="translate(${x} ${y}) scale(${sc}) rotate(${t*90+i*20})" fill="${i%3?'#ffd75e':'#fff5c2'}"/>`;
  }
  return g;
}

// ---------- scenes ----------
function render(scene,t){
  const C=cast(); for(const k in C){C[k].blink=blink(t,C[k].ph);C[k].bob=Math.sin(t*2.2+C[k].ph)*3}
  let arms={}; for(const k in C) arms[k]=[[-1,...REST,'fist'],[1,...RESTR,'fist']];
  let cam={z:1,cx:540,cy:960}, fx='', plateGlow=0, eaten=0, under='';
  const {mama,adam,aisyah,abah}=C;
  mama.look=[4,2];aisyah.look=[-4,2];abah.look=[-6,2];

  if(scene===1){
    cam={z:lerp(1.12,1.2,t/5),cx:540,cy:1060};
    const r=seg(t,.7,1.5);
    arms.adam[1]=[1,lerp(14,25,r),lerp(230,380,r),'fist'];
    adam.look=[lerp(0,6,r),lerp(0,9,r)];adam.mouth=r>.3?'o':'smile';adam.open=Math.abs(Math.sin(t*6))*.4;adam.bigEyes=r>.3;
    adam.tilt=Math.sin(t*14)*1.5*(t<.7?1:0)+(r*-4);
    mama.look=[8,4];aisyah.look=[-8,4];abah.look=[-10,4];
    if(t>3.2){abah.brow=8*seg(t,3.2,3.6);abah.mouth='o'}
  }
  if(scene===2){
    cam={z:1.38,cx:668,cy:1010};
    const up=back((t-.15)/.45);
    arms.abah[0]=[-1,lerp(-14,158,up),lerp(230,205,up),t>.3?'finger':'fist'];
    abah.brow=8;abah.mouth=t<1.6?'smile':'big';abah.look=[-10,0];
    arms.adam[1]=[1,25,380,'fist'];
    adam.bigEyes=1;adam.mouth='o';adam.open=.6;adam.look=[10,-2];adam.blink=1;
    adam.tilt=t>.3&&t<.7?Math.sin(t*60)*3:0;
    aisyah.look=[-10,-2];aisyah.mouth=t>1.2?'big':'smile';
    const ex=back((t-.3)/.35);
    if(t>.3) fx+=`<g transform="translate(${adam.x+70} ${adam.y-260}) scale(${ex}) rotate(12)"><rect x="-14" y="-70" width="28" height="70" rx="12" fill="#ff5a4f"/><circle cx="0" cy="22" r="15" fill="#ff5a4f"/></g>`;
  }
  if(scene===3){
    cam={z:1.75,cx:440,cy:905};
    const back1=seg(t,0,.5), think=seg(t,.4,1.0), idea=back((t-2.1)/.4), dua=seg(t,2.3,2.9);
    arms.adam[1]=[1,lerp(25,14,back1),lerp(380,230,back1),'fist'];
    if(t<2.3) arms.adam[0]=[-1,lerp(-14,-140,think),lerp(230,103,think),'fist'];
    else{ arms.adam[0]=[-1,lerp(-140,-31,dua),lerp(103,120,dua),'open']; arms.adam[1]=[1,lerp(14,31,dua),lerp(230,120,dua),'open'];}
    if(t<2.1){adam.look=[8,-12];adam.mouth='o';adam.open=0;adam.brow=4;adam.tilt=-5*think;}
    else{adam.look=[0,-2];adam.mouth='big';adam.bigEyes=1;adam.brow=10;adam.tilt=lerp(-5,0,dua);}
    if(t>1.0&&t<2.1){ // thinking dots
      for(let i=0;i<3;i++){const on=t>1.1+i*.3; if(on) fx+=`<circle cx="${adam.x+70+i*28}" cy="${adam.y-250-i*30}" r="${8+i*4}" fill="#fff" stroke="#c9b9a0" stroke-width="3"/>`}
    }
    if(t>2.1){
      const bx=adam.x, by=adam.y-300, pulse=1+Math.sin(t*8)*.04;
      fx+=`<circle cx="${bx}" cy="${by}" r="${120*idea}" fill="url(#bulbglow)"/>
       <g transform="translate(${bx} ${by}) scale(${idea*pulse})">
        ${Array.from({length:8},(_,i)=>`<line x1="0" y1="-78" x2="0" y2="-100" stroke="#ffcf3f" stroke-width="7" stroke-linecap="round" transform="rotate(${i*45-90+22.5*0} )" />`).join('')}
        <circle cx="0" cy="-10" r="44" fill="#ffe35a" stroke="#e0a91f" stroke-width="5"/>
        <rect x="-20" y="30" width="40" height="26" rx="6" fill="#9aa0aa"/><path d="M-14 -10 L-6 10 L0 -6 L6 10 L14 -10" stroke="#e0901f" stroke-width="4" fill="none"/></g>`;
    }
  }
  if(scene===4){
    cam={z:lerp(1.5,1.6,t/5),cx:440,cy:1020};
    arms.adam[0]=[-1,-31,120,'open'];arms.adam[1]=[1,31,120,'open'];
    const talking=t>.4&&t<1.4;
    adam.mouth=talking?'open':'big';adam.open=Math.abs(Math.sin((t-.4)*11));adam.happyEyes=t>.3&&t<2.2;adam.brow=6;
    plateGlow=seg(t,.6,1.4)*(0.8+0.2*Math.sin(t*5));
    fx+=sparkles(t,adam.x,1350,.6,30);
    mama.mouth='big';aisyah.mouth='big';mama.look=[10,0];aisyah.look=[-10,0];
  }
  if(scene===5){
    cam={z:1.32,cx:330,cy:1030};
    let a,l,hold=false;
    const cyc=(t-.2)%1.9, n=Math.floor((t-.2)/1.9);
    if(t<.2){a=-14;l=230}
    else if(cyc<.6){const k=seg(cyc,0,.6);a=lerp(n?-133:-14,-25,k);l=lerp(n?131:230,380,k)}
    else if(cyc<1.2){const k=seg(cyc,.6,1.2);a=lerp(-25,-133,k);l=lerp(380,131,k);hold=k<.95}
    else{a=-133;l=131}
    arms.adam[0]=[-1,a,l,'fist',hold];
    const chew=cyc>1.15;
    adam.mouth=chew?'chew':(cyc>.8?'o':'smile');adam.open=Math.abs(Math.sin(t*9));adam.happyEyes=chew;adam.look=[0,8];
    eaten=t>2.4?1:0;
    const th=back((t-1.6)/.45);
    if(t>1.6){arms.mama[1]=[1,lerp(14,-158,th),lerp(230,175,th),'thumb'];mama.mouth='big';mama.tilt=Math.sin(t*5)*3}
    mama.look=[10,2];
  }
  if(scene===6){
    cam={z:lerp(1.28,1.12,ease(t/5)),cx:540,cy:1060};
    for(const k of ['mama','adam','aisyah','abah']){
      const P=C[k], w=Math.sin(t*7+P.ph)*16, up=back((t-.1-P.ph*.08)/.4);
      const side=(k==='adam')?-1:1;
      arms[k][side<0?0:1]=[side,side*lerp(-14,-155,up)+side*-1*0+ (up>0.9?w:0)*side,lerp(230,190,up),'open'];
      P.mouth='big';P.look=[0,0];
    }
    fx+=sparkles(t,540,700,.2,18);
  }

  // --- compose ---
  const people=[mama,abah,aisyah,adam];
  let w=room(t);
  for(const P of people) w+=personBack(P);
  w+=table();
  w+=cup(60,1350,'#f7c25a')+cup(1015,1355,'#a7d6f2');
